name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check repository contracts
        shell: pwsh
        run: |
          $temp = Join-Path ([IO.Path]::GetTempPath()) "codex-ci-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $temp | Out-Null
          try {
            # tests/test_dependency_contract.py, tests/test_documentation_contract.py
            & (Get-Command python).Source -m pip install -r requirements-dev.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\ci\run-python-tests.ps1 -PythonPath (Get-Command python).Source -TestName @("tests.test_ci_contract", "tests.test_dependency_contract", "tests.test_documentation_contract")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\ci\run-pester-tests.ps1 -Path (Resolve-Path .\tests\TestRunnerContract.Tests.ps1).Path -ExpectedSkipCount 0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\ci\run-pester-tests.ps1 -Path (Resolve-Path .\tests\InstallerContract.Tests.ps1).Path -ExpectedSkipCount 0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\ci\run-pester-tests.ps1 -Path (Resolve-Path .\tests\PythonRuntimeContract.Tests.ps1).Path -ExpectedSkipCount 0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\ci\run-pester-tests.ps1 -Path (Resolve-Path .\tests\SecretScan.Tests.ps1).Path -ExpectedSkipCount 0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue }

  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - python311_selected
          - python313_selected
          - python_absent
          - python312_ready
          - restart_resume
          - venv_reuse
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run installer scenario in temporary roots
        shell: pwsh
        env:
          INSTALLER_SCENARIO: ${{ matrix.scenario }}
        run: |
          $root = Join-Path ([IO.Path]::GetTempPath()) "codex-installer-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            & .\ci\run-installer-scenario.ps1 -Scenario $env:INSTALLER_SCENARIO -Root $root
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue }

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Full Python suite
        shell: pwsh
        run: .\ci\run-python-tests.ps1 -PythonPath (Get-Command python).Source -ExpectedSkipCount 4

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Windows PowerShell Pester wrapper
        shell: pwsh
        run: .\ci\run-pester-tests.ps1 -Path (Get-ChildItem tests\*.Tests.ps1).FullName -ExpectedSkipCount 0

  package:
    needs: [contracts, installer, python, pester]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source and install sync
        shell: pwsh
        run: .\plugins\obsidian-manuscript-publisher\skills\obsidian-manuscript-publisher\scripts\verify_skill_sync.py --check
      - name: Build release
        shell: pwsh
        run: |
          $root = Join-Path ([IO.Path]::GetTempPath()) "codex-package-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $root | Out-Null
          .\ci\build-release.ps1 -SourceRoot (Get-Location) -OutputRoot $root -Version "0.5.2"
          "CODEX_PACKAGE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release and clean install
        shell: pwsh
        run: .\ci\verify-release.ps1 -Archive (Get-ChildItem $env:CODEX_PACKAGE_ROOT -Filter *.zip | Select-Object -First 1).FullName -Checksums (Join-Path $env:CODEX_PACKAGE_ROOT "SHA256SUMS") -TestRoot (Join-Path $env:TEMP "codex-clean-install-$([guid]::NewGuid().ToString('N'))")
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-ci-evidence
          path: ${{ runner.temp }}

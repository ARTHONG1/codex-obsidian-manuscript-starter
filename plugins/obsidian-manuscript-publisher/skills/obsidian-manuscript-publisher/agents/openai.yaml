interface:
  display_name: "Obsidian Manuscript Publisher"
  short_description: "Codex 대화형 제작 Step·가로 AI 이미지 기반 A4 원고"
  default_prompt: "현재 대화를 독립된 Obsidian 자료로 저장하고, 사용자의 요청·Codex의 제작·사용자 확인 흐름으로 유동적인 Step 1~N을 구성해 줘. 미리 보기·모든 Step·실전 활용하기 이미지는 Codex 내장 이미지 생성으로 가로형 16:9로 만들고, 각 이미지 바로 아래에 주석을 넣어 검증이 ready일 때만 A4 HTML/PDF와 Obsidian 게시를 완료해 줘."
